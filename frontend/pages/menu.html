<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardápio - Laricafé</title>
    <link rel="stylesheet" href="../css/menu.css" />
  </head>

  <body>
    <header>
      <h1>Laricafé</h1>
      <nav>
        <ul>
          <li><a href="inicial.html">Início</a></li>
          <li><a href="menu.html">Cardápio</a></li>
          <li><a href="carrinho.html">Carrinho</a></li>
        </ul>
      </nav>
    </header>

    <div class="barra-categorias">
      <a href="#quentes" class="btn-categoria">☕ Cafés Quentes</a>
      <a href="#gelados" class="btn-categoria">🧊 Cafés Gelados</a>
      <a href="#bebidas" class="btn-categoria">🧃 Outras Bebidas</a>
      <a href="#paes" class="btn-categoria">🥐 Pães e Omeletes</a>
      <a href="#salgados" class="btn-categoria">🥐 Salgados</a>
      <a href="#doces" class="btn-categoria">🍰 Bolos e Doces</a>
    </div>

    <main id="cardapio"></main>

    <footer>
      <p>&copy; 2026 Laricafé. Todos os direitos reservados.</p>
    </footer>
    <script src="../js/produtos.js" defer></script>
    <script>
      const produtos = document.querySelectorAll(".item-cardapio");
  
      let carrinho = JSON.parse(localStorage.getItem("laricafeCarrinho")) || [];
  
      produtos.forEach((produto) => {
          const botao = produto.querySelector("button");
  
          botao.addEventListener("click", () => {
              const nome = produto.querySelector("h3").textContent.trim();
              const descricao = produto.querySelector("p").textContent.trim();
              const precoTexto = produto.querySelector("span").textContent;
  
              const preco = Number(
                  precoTexto.replace(/[^\d,]/g, "").replace(",", ".")
              );
  
              const imagem = produto.querySelector("img").src;
  
              const produtoExistente = carrinho.find(item => item.nome === nome);
  
              if (produtoExistente) {
                  produtoExistente.quantidade++;
              } else {
                  carrinho.push({
                      nome,
                      descricao,
                      preco,
                      imagem,
                      quantidade: 1
                  });
              }
  
              localStorage.setItem("laricafeCarrinho", JSON.stringify(carrinho));
  
              const textoOriginal = botao.textContent;
              botao.textContent = "Adicionado!";
  
              setTimeout(() => {
                  botao.textContent = textoOriginal;
              }, 1000);
          });
      });
  </script>
  </body>
</html>
